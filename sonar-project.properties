# SonarQube Cloud analysis, run by the Security workflow (.github/workflows/security.yaml).
sonar.organization=w0rkspace
sonar.projectKey=w0rkspace_portfolio-web
sonar.projectName=portfolio-web

# Unit tests live next to the code (src/**/*.spec.ts).
sonar.sources=src
sonar.tests=src
sonar.exclusions=**/*.spec.ts
sonar.test.inclusions=**/*.spec.ts

# Written by `pnpm test:cov` (Angular unit-test builder, coverage/<project>/).
sonar.javascript.lcov.reportPaths=coverage/devsonic.cl/lcov.info

# The scan fails when the Quality Gate does not pass.
sonar.qualitygate.wait=true
